name: SNS Bot Post

# 自動投稿は停止中（X は無料枠枯渇、Threads も運用停止）。
# 手動で動かしたいときは workflow_dispatch から channel を指定して実行する。
# トークンと投稿履歴は Gist に保存し、期限が近づくと自動でリフレッシュする。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら実投稿せず内容だけ表示"
        type: boolean
        default: false
      channel:
        description: '対象チャンネル (threads / x / all)'
        required: false
        default: "threads"

permissions:
  contents: read

concurrency:
  group: sns-bot # Gist 書き込み競合を防ぐため多重実行を禁止
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 投稿
        working-directory: 09-sns-bot
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          BOT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
        run: |
          node src/index.mjs post --channel "${{ github.event.inputs.channel || 'threads' }}"
