name: X Image Diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 画像付き投稿の確認
        working-directory: 09-sns-bot
        run: node diag-img.mjs
